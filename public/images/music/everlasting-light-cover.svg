<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Everlasting Light album cover</title>
  <desc id="desc">A blue and gold sacred album cover placeholder with a luminous cross and horizon.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="56%">
      <stop offset="0" stop-color="#f7efe0" stop-opacity="0.92" />
      <stop offset="0.24" stop-color="#f3d58b" stop-opacity="0.5" />
      <stop offset="1" stop-color="#07111f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.5" stop-color="#0b1f3a" />
      <stop offset="1" stop-color="#123c69" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.42" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#f3d58b" flood-opacity="0.24" />
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)" />
  <circle cx="600" cy="405" r="450" fill="url(#glow)" />
  <path d="M0 780 C220 700 330 820 500 740 C690 650 790 835 980 730 C1080 675 1150 700 1200 675 L1200 1200 L0 1200 Z" fill="#06101d" opacity="0.7" />
  <path d="M0 890 C210 830 320 950 520 865 C710 785 830 960 1020 850 C1100 805 1160 820 1200 805 L1200 1200 L0 1200 Z" fill="#07111f" opacity="0.94" />
  <g filter="url(#shadow)" fill="none" stroke="#f3d58b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 230 v420" stroke-width="24" />
    <path d="M490 370 h220" stroke-width="24" />
    <path d="M420 650 C500 590 700 590 780 650" stroke-width="8" opacity="0.7" />
  </g>
  <g fill="#f7efe0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="910" font-size="64" letter-spacing="4">THE EVERLASTING LIGHT</text>
    <text x="600" y="976" font-size="28" fill="#f3d58b" letter-spacing="7">A WAY OF QUIET LIGHT HYMN COLLECTION</text>
    <text x="600" y="1046" font-size="30" fill="#b9c7d6" letter-spacing="5">THE WAY OF QUIET LIGHT</text>
  </g>
</svg>
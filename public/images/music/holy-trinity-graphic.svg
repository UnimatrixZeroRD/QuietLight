<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The Holy Trinity music collection</title>
  <desc id="desc">A blue and gold lantern-inspired placeholder graphic for the three Quiet Light albums.</desc>
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0" stop-color="#f3d58b" stop-opacity="0.72" />
      <stop offset="0.32" stop-color="#d8a84f" stop-opacity="0.28" />
      <stop offset="1" stop-color="#07111f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.45" stop-color="#123c69" />
      <stop offset="1" stop-color="#07111f" />
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#123c69" stop-opacity="0.96" />
      <stop offset="1" stop-color="#07111f" stop-opacity="0.98" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#d8a84f" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)" />
  <circle cx="600" cy="255" r="355" fill="url(#goldGlow)" />
  <path d="M0 520 C180 455 275 555 420 495 C575 430 650 555 810 495 C960 438 1030 500 1200 440 L1200 675 L0 675 Z" fill="#06101d" opacity="0.64" />
  <path d="M0 575 C155 535 302 610 460 552 C612 496 732 608 893 548 C1040 493 1120 545 1200 515 L1200 675 L0 675 Z" fill="#07111f" opacity="0.92" />
  <g filter="url(#softShadow)">
    <rect x="155" y="145" width="250" height="342" rx="28" fill="url(#card)" stroke="#d8a84f" stroke-opacity="0.58" stroke-width="3" />
    <rect x="475" y="105" width="250" height="382" rx="28" fill="url(#card)" stroke="#f3d58b" stroke-opacity="0.75" stroke-width="3" />
    <rect x="795" y="145" width="250" height="342" rx="28" fill="url(#card)" stroke="#d8a84f" stroke-opacity="0.58" stroke-width="3" />
  </g>
  <g fill="none" stroke="#f3d58b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 245 v116" stroke-width="9" opacity="0.85" />
    <path d="M250 280 h60" stroke-width="9" opacity="0.85" />
    <path d="M600 210 v150" stroke-width="11" />
    <path d="M560 260 h80" stroke-width="11" />
    <path d="M920 245 v116" stroke-width="9" opacity="0.85" />
    <path d="M890 280 h60" stroke-width="9" opacity="0.85" />
  </g>
  <g fill="#f7efe0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="548" font-size="54" letter-spacing="4">THE HOLY TRINITY</text>
    <text x="600" y="598" font-size="24" fill="#f3d58b" letter-spacing="7">MUSIC OF THE QUIET LIGHT</text>
  </g>
</svg>
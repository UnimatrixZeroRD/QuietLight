<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Flame Remains album cover</title>
  <desc id="desc">A blue and gold sacred album cover placeholder with a glowing lantern flame.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#f3d58b" stop-opacity="0.95" />
      <stop offset="0.22" stop-color="#ffb347" stop-opacity="0.45" />
      <stop offset="1" stop-color="#07111f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.52" stop-color="#123c69" />
      <stop offset="1" stop-color="#07111f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.46" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#d8a84f" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)" />
  <circle cx="600" cy="475" r="430" fill="url(#glow)" />
  <path d="M0 900 C190 800 320 955 500 850 C690 740 820 920 1005 825 C1090 780 1145 770 1200 790 L1200 1200 L0 1200 Z" fill="#06101d" opacity="0.86" />
  <g filter="url(#shadow)">
    <path d="M470 350 h260 l-28 432 h-204 Z" fill="rgba(7,17,31,0.72)" stroke="#d8a84f" stroke-width="10" />
    <path d="M525 350 C530 285 670 285 675 350" fill="none" stroke="#d8a84f" stroke-width="12" stroke-linecap="round" />
    <path d="M548 400 h104 l-13 275 h-78 Z" fill="rgba(18,60,105,0.82)" stroke="#f3d58b" stroke-width="7" />
    <path d="M600 625 C544 565 575 505 612 465 C650 525 690 575 600 625 Z" fill="#ffb347" />
    <path d="M604 586 C580 552 602 520 620 500 C637 535 646 565 604 586 Z" fill="#f7efe0" opacity="0.9" />
  </g>
  <g fill="#f7efe0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="910" font-size="74" letter-spacing="4">THE FLAME REMAINS</text>
    <text x="600" y="976" font-size="28" fill="#f3d58b" letter-spacing="8">THE LANTERN PSALMS · VOLUME I</text>
    <text x="600" y="1046" font-size="30" fill="#b9c7d6" letter-spacing="5">THE WAY OF QUIET LIGHT</text>
  </g>
</svg>
name: Merge New Testament PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/merge-new-testament-pdfs.py
      - public/downloads/bible/geneva-1599/enggnv_*.pdf
      - .github/workflows/merge-new-testament.yml

permissions:
  contents: write

jobs:
  merge-new-testament:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: python -m pip install --upgrade pypdf

      - name: Merge New Testament PDFs
        run: python scripts/merge-new-testament-pdfs.py

      - name: Commit merged New Testament PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/bible/geneva-1599/new-testament-complete.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build complete New Testament PDF"
            git push
          fi
